<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="theme-color" content="#f6f7f9">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · CrewCamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="style.css"></head>
<body class="th-white login" style="padding-top:max(14px,env(safe-area-inset-top))">
<script src="auth.js"></script>
<form class="panel card" id="f">
  <div class="head"><svg class="logo big" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a7fc4"/><stop offset="1" stop-color="#6b9bd3"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgl)"/><path d="M14 16h8c2 0 3 1 3 3v22c0 3 1 5 3 6l-2 4H17c-2 0-3-1-3-3z" fill="#fff"/><path d="M27 16h25a2 2 0 0 1 2 2v25a2 2 0 0 1-2 2H27z" fill="#fff"/><path d="M30 18l9 2.500a2 2 0 0 1 1.500 2V36l-10.500 6z" fill="#7f97b3"/><path d="M38 41c5-1 11-1 13 4v1H38z" fill="#7f97b3"/><path d="M20.500 38l6 6L40 30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.500 38l6 6L40 30" fill="none" stroke="#4a7fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 class="logo-h"><span class="wm">CrewCamp</span></h1><p class="sub"><i>your coworking camp!</i></p></div>
  <div class="tabs" role="tablist"><button type="button" id="tl" class="on" role="tab" aria-selected="true">Log in</button><button type="button" id="ts" role="tab" aria-selected="false">Sign up</button></div>
  <input id="nm" placeholder="Display name" maxlength="60" autocomplete="name" hidden>
  <input id="jc" placeholder="Server passkey (optional)" maxlength="12" autocapitalize="characters" autocomplete="off" hidden>
  <input id="u" placeholder="Username" enterkeyhint="next" autocomplete="username" autocapitalize="none" required autofocus>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
  <div id="hint" class="sub" hidden style="font-size:.75rem;margin:-2px 0 4px">Pick your display name, username and password, then verify with Google. You can use either to log in later.</div>
  <div id="inv" class="sub" hidden style="font-size:.78rem;font-weight:700;margin:-2px 0 4px">🎟 You were invited to a server. Log in or sign up to join it.</div>
  <div id="err" class="bad" style="font-size:.78rem;font-weight:700;min-height:1.2em"></div>
  <button class="btn pri big" type="submit">Log in</button>
  <div class="foot">Version 2.16.0</div>
  <div id="gwrap" hidden><div class="or" id="orl"><span>or</span></div><div class="gbox"><div id="gbtn" class="gbtn"></div><div id="gblock" class="gblock" hidden></div></div></div>
</form>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  const JOIN=(new URLSearchParams(location.search).get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
  if(JOIN){$('inv').hidden=false;$('jc').value=JOIN}
  // after login / sign-up: use the passkey (typed or from the link) to enter that server with the position it gives
  async function enter(){
    const c=($('jc').value||JOIN).toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!c)return location.href='cross.html';
    sessionStorage.removeItem('stb_svl');
    try{const j=await api('/api/servers/join','POST',{code:c});j.id==='cepalco'?localStorage.removeItem('stb_sv'):localStorage.setItem('stb_sv',j.id);location.href='index.html'}
    catch(x){if(/already in/i.test(x.message))return location.href='cross.html';err.textContent=x.message+' You are signed in; you can add a server from the menu.';setTimeout(()=>location.href='cross.html',3500)}
  }

  const btn=document.querySelector('button[type=submit]'),err=$('err'),JC=$('jc'),NM=$('nm'),U=$('u'),P=$('p');
  if(await currentUser())return enter();
  let mode='login',cfg={},gReady=false;
  const UN=/^[a-z0-9_.-]{3,30}$/;
  const formErr=()=>!NM.value.trim()?'Enter a display name first.':!UN.test(U.value.trim().toLowerCase())?'Username: 3–30 letters, numbers, . _ -':P.value.length<6?'Password must be at least 6 characters.':'';
  function paintGoogle(){   // (re)draw the Google button for the current mode
    if(!gReady)return;
    const su=mode==='signup';
    $('gbtn').innerHTML='';
    google.accounts.id.renderButton($('gbtn'),{type:'standard',theme:'outline',size:'large',text:su?'signup_with':'signin_with',shape:'pill',logo_alignment:'left',width:Math.min(400,Math.round($('gbtn').getBoundingClientRect().width)||300)});
    syncBlock();
  }
  // In sign-up mode a see-through cover sits on the Google button until all three fields are valid; tapping it explains what is missing.
  function syncBlock(){$('gblock').hidden=!(mode==='signup'&&formErr())}
  function setMode(m){
    mode=m;const su=m==='signup';err.textContent='';
    $('tl').classList.toggle('on',!su);$('ts').classList.toggle('on',su);$('tl').setAttribute('aria-selected',String(!su));$('ts').setAttribute('aria-selected',String(su));
    NM.hidden=!su;NM.required=su;JC.hidden=!su;$('hint').hidden=!su;btn.hidden=su;$('orl').hidden=su;
    P.autocomplete=su?'new-password':'current-password';U.autocomplete=su?'off':'username';
    $('gwrap').hidden=!gReady&&!su?true:false;
    if(su&&!gReady){err.textContent=cfg.googleClientId?'Loading Google…':'Sign up is not available yet.'}
    paintGoogle();
  }
  $('tl').onclick=()=>setMode('login');$('ts').onclick=()=>setMode('signup');
  [NM,U,P,JC].forEach(i=>i.addEventListener('input',()=>{syncBlock();if(mode==='signup')err.textContent=''}));
  $('gblock').onclick=()=>{err.textContent=formErr()};
  $('f').onsubmit=async e=>{
    e.preventDefault();if(mode==='signup')return;
    btn.disabled=true;btn.textContent='Logging in…';err.textContent='';
    try{await login(U.value,P.value);await enter()}
    catch(x){err.textContent=x.status?x.message:'Cannot reach the server. Check your connection.';btn.disabled=false;btn.textContent='Log in'}
  };
  try{cfg=await api('/api/config')}catch(e){}
  if(!cfg.googleClientId)return;
  const start=()=>{
    if(!window.google||!google.accounts)return setTimeout(start,150);
    google.accounts.id.initialize({client_id:cfg.googleClientId,ux_mode:'popup',callback:async r=>{
      err.textContent='';
      const su=mode==='signup';
      if(su&&formErr())return err.textContent=formErr();
      try{
        sessionStorage.removeItem('stb_svl');
        await api('/api/google','POST',su?{credential:r.credential,mode:'signup',name:NM.value,username:U.value,password:P.value}:{credential:r.credential});
        await enter();
      }catch(x){err.textContent=x.status?x.message:'Cannot reach the server. Check your connection.'}
    }});
    gReady=true;$('gwrap').hidden=false;if(err.textContent==='Loading Google…')err.textContent='';
    paintGoogle();
  };
  start();
})();
</script></body></html>
